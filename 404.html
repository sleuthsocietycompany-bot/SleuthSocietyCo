<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Sleuth Society Co.</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/Sleuth-logo.jpeg" type="image/jpeg" />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;1,700&family=Cormorant+Garamond:ital,wght@0,400;1,400&family=Josefin+Sans:wght@300;400&display=swap" rel="stylesheet" />
  <style>
    :root { --gold: #C9A84C; --gold-light: #E8C97A; --gold-dim: #7a6330; --cream: #F2EBD9; --dark: #0E0C09; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; display: flex; align-items: center; justify-content: center; text-align: center; padding: 3rem 1.5rem; background: var(--dark); color: var(--cream); font-family: 'Cormorant Garamond', Georgia, serif; }
    .eyebrow { font-family: 'Josefin Sans', sans-serif; font-size: 0.65rem; letter-spacing: 0.5em; text-transform: uppercase; color: var(--gold); margin-bottom: 1.2rem; }
    h1 { font-family: 'Playfair Display', serif; font-size: clamp(2.2rem, 7vw, 4rem); line-height: 1.1; margin-bottom: 1.2rem; }
    h1 em { color: var(--gold); }
    p { font-size: 1.15rem; font-style: italic; color: rgba(242,235,217,0.7); max-width: 480px; margin: 0 auto 2.2rem; line-height: 1.7; }
    .btns { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    a { font-family: 'Josefin Sans', sans-serif; font-size: 0.7rem; letter-spacing: 0.3em; text-transform: uppercase; text-decoration: none; padding: 1rem 2.2rem; }
    .primary { background: var(--gold); color: var(--dark); }
    .primary:hover { background: var(--gold-light); }
    .outline { border: 1px solid var(--gold-dim); color: var(--gold); }
    .outline:hover { border-color: var(--gold); color: var(--gold-light); }
  </style>
</head>
<body>
  <main>
    <p class="eyebrow">Error 404 &#183; Case Not Found</p>
    <h1>This clue leads <em>nowhere.</em></h1>
    <p>The page you&#8217;re looking for has vanished without a trace. Try one of these leads instead.</p>
    <div class="btns">
      <a class="primary" href="/events.html">Buy Tickets</a>
      <a class="outline" href="/">Home</a>
    </div>
  </main>
</body>
</html>
